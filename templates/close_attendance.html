<!DOCTYPE html>
<html>
<head>
    <title>Close Attendance</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            text-align:center;
            margin-top:120px;
        }

        .box{
            background:white;
            width:500px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        a{
            text-decoration:none;
        }

        .yes{
            background:#dc3545;
            color:white;
            padding:12px 25px;
            border-radius:5px;
            margin-right:10px;
        }

        .cancel{
            background:#28a745;
            color:white;
            padding:12px 25px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="box">

<h2>⚠ Close Attendance</h2>

<p>

Are you sure you want to close today's attendance?

</p>

<p>

All students whose attendance is not marked today
will automatically be marked as <b>Absent</b>.

</p>

<br>

<a href="/confirm_close_attendance" class="yes">

Yes, Close Attendance

</a>

<a href="/attendance" class="cancel">

Cancel

</a>

</div>

</body>
</html>
